<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>History — LEVoiceCall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📞</text></svg>" />
  <style>
    .history-main { padding: 16px; max-width: 560px; margin: 0 auto; }
    .history-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 16px;
    }
    .history-header h1 { font-size: 1.35rem; margin: 0; }
    .history-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      background: #1a1d27;
      border: 1px solid #2e3348;
      border-radius: 14px;
      padding: 14px 16px;
      display: grid;
      gap: 6px;
    }
    .history-item .row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }
    .history-name { font-weight: 600; font-size: 1rem; }
    .history-code {
      font-family: ui-monospace, monospace;
      letter-spacing: 0.12em;
      font-weight: 700;
      color: #7b88f5;
      font-size: 0.95rem;
    }
    .history-meta { font-size: 0.8rem; color: #6b7394; }
    .badge-role {
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; padding: 3px 8px; border-radius: 6px;
    }
    .badge-role.created { background: rgba(91,106,240,0.2); color: #7b88f5; }
    .badge-role.joined { background: rgba(0,201,167,0.18); color: #00c9a7; }
    .badge-status {
      font-size: 0.65rem; font-weight: 600; padding: 3px 8px; border-radius: 6px;
      background: rgba(255,179,71,0.15); color: #ffb347;
    }
    .badge-status.closed { background: rgba(107,115,148,0.25); color: #a0a8c0; }
    .history-empty {
      text-align: center; padding: 48px 20px; color: #6b7394;
    }
    .history-empty strong { display: block; color: #f0f2f8; margin-bottom: 8px; font-size: 1.1rem; }
    .history-actions { display: flex; gap: 8px; margin-top: 8px; }
    .btn-sm {
      padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600;
      border: none; cursor: pointer;
    }
    .btn-sm.primary { background: #5b6af0; color: #fff; }
    .btn-sm.ghost { background: transparent; color: #a0a8c0; border: 1px solid #2e3348; }
  </style>
</head>
<body class="app-body">
  <aside id="side-menu" class="side-menu" aria-hidden="true">
    <div class="side-menu-header">
      <span class="side-logo">LEVoiceCall</span>
      <button id="close-menu" class="icon-btn" aria-label="Close menu">✕</button>
    </div>
    <nav class="side-nav">
      <a href="/main/main.html" class="side-link">Home</a>
      <a href="/main/history.html" class="side-link active">History</a>
      <a href="/main/about.html" class="side-link">About</a>
      <button id="menu-logout" class="side-link danger">Logout</button>
    </nav>
  </aside>
  <div id="menu-overlay" class="menu-overlay hidden"></div>

  <header class="top-nav">
    <button id="menu-btn" class="icon-btn" aria-label="Open menu">☰</button>
    <div class="nav-brand">History</div>
    <span style="width:40px"></span>
  </header>

  <main class="history-main">
    <div class="history-header">
      <h1>Call history</h1>
      <button type="button" id="clear-history" class="btn-sm ghost">Clear</button>
    </div>
    <ul id="history-list" class="history-list"></ul>
    <div id="history-empty" class="history-empty hidden">
      <strong>No calls yet</strong>
      Create or join a call and it will show up here.
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/history.js"></script>
  <script src="/js/main.js"></script>
  <script>
    (function () {
      if (!window.LEVCAuth?.requireAuth()) return;
      const listEl = document.getElementById('history-list');
      const emptyEl = document.getElementById('history-empty');

      function formatWhen(iso) {
        try {
          const d = new Date(iso);
          return d.toLocaleString(undefined, {
            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });
        } catch (e) {
          return '';
        }
      }

      function render() {
        const items = window.LEVCHistory?.getAll?.() || [];
        listEl.innerHTML = '';
        if (!items.length) {
          emptyEl.classList.remove('hidden');
          return;
        }
        emptyEl.classList.add('hidden');
        items.forEach((item) => {
          const li = document.createElement('li');
          li.className = 'history-item';
          const roleClass = item.role === 'created' ? 'created' : 'joined';
          const roleLabel = item.role === 'created' ? 'Created' : 'Joined';
          const statusClass = item.status === 'closed' ? 'closed' : '';
          const statusLabel = item.status === 'closed' ? 'Ended' : 'Saved';
          li.innerHTML =
            '<div class="row">' +
            '<span class="history-name"></span>' +
            '<span class="badge-role ' + roleClass + '">' + roleLabel + '</span>' +
            '</div>' +
            '<div class="row">' +
            '<span class="history-code"></span>' +
            '<span class="badge-status ' + statusClass + '">' + statusLabel + '</span>' +
            '</div>' +
            '<div class="history-meta"></div>' +
            '<div class="history-actions">' +
            '<button type="button" class="btn-sm primary" data-rejoin>Rejoin</button>' +
            '<button type="button" class="btn-sm ghost" data-copy>Copy code</button>' +
            '</div>';
          li.querySelector('.history-name').textContent = item.callName || 'Call';
          li.querySelector('.history-code').textContent = item.joinCode;
          li.querySelector('.history-meta').textContent =
            formatWhen(item.at) +
            (item.creatorName ? ' · ' + item.creatorName : '');
          li.querySelector('[data-rejoin]').addEventListener('click', () => {
            window.location.href = '/main/call.html?call=' + encodeURIComponent(item.joinCode);
          });
          li.querySelector('[data-copy]').addEventListener('click', function () {
            navigator.clipboard?.writeText(item.joinCode).then(() => {
              this.textContent = 'Copied';
              setTimeout(() => { this.textContent = 'Copy code'; }, 1200);
            });
          });
          listEl.appendChild(li);
        });
      }

      document.getElementById('clear-history')?.addEventListener('click', () => {
        if (confirm('Clear all call history on this device?')) {
          window.LEVCHistory.clear();
          render();
        }
      });

      render();
    })();
  </script>
</body>
</html>
